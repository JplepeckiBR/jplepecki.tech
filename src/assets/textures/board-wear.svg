<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" aria-hidden="true" focusable="false">
  <!-- Handled electronics: solder-mask / ABS micro texture, a few hairline marks. Much lighter than the mat. -->
  <defs>
    <filter id="board-tooth" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="2" seed="57" stitchTiles="stitch" result="tooth" />
      <feColorMatrix in="tooth" values="0 0 0 0 0.78  0 0 0 0 0.8  0 0 0 0 0.79  2.4 0 0 0 -1.05" />
    </filter>
    <filter id="board-mottle" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.01" numOctaves="2" seed="8" stitchTiles="stitch" result="mottle" />
      <feColorMatrix in="mottle" values="0 0 0 0 0.85  0 0 0 0 0.88  0 0 0 0 0.86  2 0 0 0 -0.85" />
    </filter>
  </defs>
  <rect width="512" height="512" opacity="0.09" filter="url(#board-tooth)" />
  <rect width="512" height="512" opacity="0.035" filter="url(#board-mottle)" />
  <g fill="none" stroke="#e6ebe8" stroke-linecap="round" stroke-width="0.4" opacity="0.07">
    <path d="M71 118l23-4" />
    <path d="M318 264l16 3" />
    <path d="M402 77l-11 9" />
    <path d="M188 431l27-2" />
  </g>
</svg>
