    <path d="M35 18l5 22m78 34-3 31m99 42 4 24M79 188l-2 38" stroke="#8c806b" stroke-width="0.45" opacity="0.2" />
  </g>

  <g fill="#5c5242" opacity="0.13">
    <circle cx="28" cy="102" r="0.9" /><circle cx="33" cy="98" r="0.55" /><circle cx="111" cy="43" r="0.7" />
    <circle cx="196" cy="91" r="0.8" /><circle cx="203" cy="94" r="0.45" /><circle cx="149" cy="229" r="0.8" />
  </g>
</svg>
