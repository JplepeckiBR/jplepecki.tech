<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false">
  <defs>
    <filter id="paper-grain-noise" x="-6%" y="-6%" width="112%" height="112%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.32 0.58" numOctaves="2" seed="43" result="noise" />
      <feColorMatrix
        in="noise"
        values="0 0 0 0 0.34
                0 0 0 0 0.29
                0 0 0 0 0.21
                0.33 0.34 0.33 0 -0.7"
      />
    </filter>
    <filter id="paper-fiber-warp" x="-8%" y="-8%" width="116%" height="116%" color-interpolation-filters="sRGB">
      <feTurbulence type="turbulence" baseFrequency="0.018 0.11" numOctaves="2" seed="9" result="fiber" />
      <feDisplacementMap in="SourceGraphic" in2="fiber" scale="1.1" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>

  <rect width="256" height="256" fill="#665943" opacity="0.13" filter="url(#paper-grain-noise)" />

  <g fill="none" stroke-linecap="round" filter="url(#paper-fiber-warp)">
