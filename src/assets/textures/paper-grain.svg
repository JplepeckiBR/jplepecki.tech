<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240" aria-hidden="true" focusable="false">
  <!-- Uncoated paper: fine tooth, faint stretched fibres, soft cloudy formation. No scratch lines. -->
  <defs>
    <filter id="paper-tooth" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.95" numOctaves="2" seed="43" stitchTiles="stitch" result="tooth" />
      <feColorMatrix in="tooth" values="0 0 0 0 0.36  0 0 0 0 0.31  0 0 0 0 0.23  2.4 0 0 0 -1.0" />
    </filter>
    <filter id="paper-fibre" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.09 0.5" numOctaves="2" seed="9" stitchTiles="stitch" result="fibre" />
      <feColorMatrix in="fibre" values="0 0 0 0 0.42  0 0 0 0 0.37  0 0 0 0 0.28  3 0 0 0 -1.55" />
    </filter>
    <filter id="paper-formation" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" seed="21" stitchTiles="stitch" result="cloud" />
      <feColorMatrix in="cloud" values="0 0 0 0 0.45  0 0 0 0 0.4  0 0 0 0 0.3  2 0 0 0 -0.85" />
    </filter>
  </defs>
  <rect width="240" height="240" opacity="0.14" filter="url(#paper-tooth)" />
  <rect width="240" height="240" opacity="0.1" filter="url(#paper-fibre)" />
  <rect width="240" height="240" opacity="0.05" filter="url(#paper-formation)" />
</svg>
